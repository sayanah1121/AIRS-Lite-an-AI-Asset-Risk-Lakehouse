# Keep spark-submit output readable: warnings from Spark, info from our own jobs (print statements).
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Spark standalone master/worker daemons log what they schedule.
logger.deploy.name = org.apache.spark.deploy
logger.deploy.level = info
logger.deployclient.name = org.apache.spark.deploy.client
logger.deployclient.level = warn
