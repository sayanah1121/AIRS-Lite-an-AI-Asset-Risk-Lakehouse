# Shared by spark-master, spark-worker and the Airflow container (driver side).
spark.driver.extraClassPath              /opt/iceberg-jars/*:/opt/spark-extra-jars/*
spark.executor.extraClassPath            /opt/iceberg-jars/*:/opt/spark-extra-jars/*

spark.sql.extensions                     org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                      tracewell
spark.sql.catalog.tracewell                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.tracewell.type              rest
spark.sql.catalog.tracewell.uri               http://iceberg-rest:8181
spark.sql.catalog.tracewell.warehouse         s3://warehouse/
spark.sql.catalog.tracewell.io-impl           org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.tracewell.s3.endpoint       http://seaweedfs:8333
spark.sql.catalog.tracewell.s3.path-style-access true

spark.sql.session.timeZone               UTC
spark.executor.memory                    640m
spark.driver.memory                      512m
spark.ui.showConsoleProgress             false

# Catalog tables are small (thousands of rows): fewer shuffle partitions = far less scheduling overhead.
spark.sql.shuffle.partitions             8
